{% extends 'base.html' %}
{% block conteudo %}
<title>CSV Analyzer</title>
<div class="home-container">
    <h1>CSV <span>ANALYZER</span></h1>
    <h3>O projeto consiste em um analisador visual e textual de csv, contém a integração de uma api, para conversação sobre seu arquivo enviado, além de gráficos para melhor visualização dos dados!!</h3>
    <a href="/index" class="top-right-btn" style="position: static; margin-top: 20px;">START</a>
</div>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .home-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 700px;
        padding: 20px;
    }

    .home-container h3 {
        font-size: 1rem;
        font-weight: 400;
        color: #a0a0a0;
        line-height: 1.5;
        margin-top: 15px;
        margin-bottom: 25px;
    }

    .analyzer-container h3 {
        font-size: 1rem;
        font-weight: 400;
        color: #a0a0a0;
        max-width: 600px;
        line-height: 1.5;
        margin-bottom: 32px;
    }

    body {
        background-color: #121212;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
    }

    .top-right-btn {
        position: absolute;
        top: 24px;
        right: 24px;
        background-color: #3b82f6;
        color: #ffffff;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        border-radius: 6px;
        transition: background-color 0.2s ease, transform 0.1s ease;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    .top-right-btn:hover {
        background-color: #2563eb;
    }

    .top-right-btn:active {
        transform: scale(0.98);
    }

    h1 {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
        color: #ffffff;
    }

    h1 span {
        color: #3b82f6;
    }
</style>
{% endblock %}
