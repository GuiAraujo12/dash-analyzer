<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
  <title id="title">Dash Analyzer</title>
  <desc id="description">Neon blue Venn diagram beside the Dash Analyzer name, on a transparent background.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6FBFF"/>
      <stop offset="0.38" stop-color="#38DCFF"/>
      <stop offset="1" stop-color="#087DFF"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4FCFF"/>
      <stop offset="0.42" stop-color="#51E4FF"/>
      <stop offset="1" stop-color="#1683FF"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#39E4FF" stop-opacity="0.52"/>
      <stop offset="0.42" stop-color="#168CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#006BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feFlood flood-color="#20D8FF" flood-opacity="0.78" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#25DBFF" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background intentionally preserved for README use. -->
  <g transform="translate(40 0)">
    <circle cx="360" cy="300" r="224" fill="url(#core)" opacity="0.7"/>
    <g fill="#0A94FF" fill-opacity="0.075" stroke="url(#ring)" stroke-width="10" filter="url(#glow)">
      <circle cx="294" cy="260" r="142"/>
      <circle cx="426" cy="260" r="142"/>
      <circle cx="360" cy="375" r="142"/>
    </g>
    <circle cx="360" cy="299" r="10" fill="#C9FAFF" filter="url(#glow)"/>
  </g>

  <g transform="translate(710 0)">
    <rect x="0" y="202" width="9" height="196" rx="4.5" fill="#32DAFF" filter="url(#softGlow)"/>
    <text x="54" y="276" fill="url(#wordmark)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="91" font-weight="750" letter-spacing="-3" filter="url(#softGlow)">Dash</text>
    <text x="55" y="361" fill="#D7F9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="350" letter-spacing="2">Analyzer</text>
  </g>
</svg>
